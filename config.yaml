# 個人版 AI 投資組合 Agent 設定
# 建議不要直接改這個檔：把要改的項目寫進 config.local.yaml（只寫要改的部分即可），
# 例如：
#   data: {source: finmind}
#   notify: {channels: [ntfy]}
# config.local.yaml 不會上傳 git，更新程式時也不會衝突。
# 只產生「建議」，不會自動下單。改策略參數前，先跑 `python run.py backtest` 比較。

capital: 1000000           # 初始資金（TWD）；實際持股以 portfolio.json 為準
lot_size: 1                # 1 = 支援零股；1000 = 只買整張
min_order_value: 1000      # 單筆建議金額低於此值就不列（避免零股手續費吃掉報酬）

# 策略（`python run.py strategies` 看完整清單）：
#   fundamental 基本面轉折 | momentum 動能 | trend 均線多頭 | breakout 突破 | value 價值
#   dividend 高股息 | lowvol 低波動 | mean_reversion 拉回買進 | chips 籌碼 | multifactor 多因子
#   llm（Claude 選股）| <任一策略>+llm（規則選股 + LLM 審查，例如 momentum+llm）
#   custom:my_strategies.momentum_only（你自己的 Python 策略）
strategy: fundamental

# 各策略參數覆蓋（不寫就用預設值，預設值見 agent/strategies/library.py）
strategies:
  momentum: {mom_min: 75, max_ret20: 0.30}
  value: {per_max: 15, pbr_max: 2.0}
  dividend: {dy_min: 5.0}
  mean_reversion: {rsi_max: 35, max_days: 10, stop_loss: 0.08}

portfolio:
  target_names: 15         # 個人資金較小，預設 15 檔
  min_names: 8
  default_cap: 0.12        # 單檔上限
  special_caps:
    "2330": 0.25
  financial_max_names: 4
  financial_max_weight: 0.25
  cash_target: 0.05
  no_trade_band: 0.035     # 目標與現況權重差 ≤ 3.5% 不動，減少頻繁交易
  swap_margin: 20          # 候選 S 需高出被換持股 ≥ 20 才替換
  max_new_buys_per_day: 5
  stop_loss: 0.15          # 硬停損：收盤比平均成本跌超過 15% 一律建議賣出（各策略可覆蓋）

entry:
  f_min: 60
  acc_min_exclusive: 0     # ACC > 0（營收成長在加速）
  mom_min: 50
  require_close_above_ma20: true
  flow_pct_min: 20

exit:
  mom_stop: 25             # MOM < 25 → 建議全賣
  ma60_break_days: 3       # 連續 3 日收在 MA60 下 → 建議全賣
  f_exit: 40               # F < 40 或 ACC ≤ 0 → 建議全賣

score_weights: {F: 0.40, MOM: 0.30, FLOW: 0.20, ACC: 0.10}

costs:
  fee_rate: 0.001425
  fee_discount: 0.6        # 券商手續費折扣（例如 6 折）
  min_fee: 1               # 零股最低手續費（依券商，常見 1 元或 20 元）
  sell_tax: 0.003

llm:
  model: claude-opus-5-5
  effort: medium
  # 給 LLM 的額外指示（你的投資偏好）
  guidance: "偏好基本面轉佳、獲利能見度高的公司；避免單一題材過度集中。"

notify:                    # 推播：各通道的金鑰請放環境變數，不要寫在這裡
  only_when_trades: false  # true = 有買賣建議才推播
  channels: []             # 可填：telegram, discord, ntfy, email
  # telegram: 需 TELEGRAM_BOT_TOKEN、TELEGRAM_CHAT_ID
  # discord : 需 DISCORD_WEBHOOK_URL
  # ntfy    : 需 NTFY_TOPIC（可選 NTFY_SERVER，預設 https://ntfy.sh）
  # email   : 需 SMTP_HOST、SMTP_PORT、SMTP_USER、SMTP_PASSWORD、EMAIL_TO

data:
  source: demo             # demo（模擬資料，可離線）| finmind（真實台股，需網路；FINMIND_TOKEN 選填）
  auto_update: true        # finmind：每次載入前先增量更新本機快取（data/cache/）
  lookback_days: 400
  universe: ["2330","2317","2454","2308","2382","2881","2882","2891","2303","3711",
             "2412","2886","2884","1216","2002","3008","2357","2885","2892","5880",
             "2207","3034","2379","3037","2345","6669","2603","1301","2395","3231"]
  financial_industries: ["金融保險業", "金融業"]

cash:
  reserve: 10000           # 交割帳戶安全水位，買進建議不會動用這筆錢

# 當沖：與波段組合分開管理。只產生計畫與盤中提醒，不會下單。
daytrade:
  capital: 300000          # 當沖可動用額度（實際只結算價差，但券商額度與風險以此計）
  risk_per_trade: 0.005    # 每筆最大虧損 = capital × 0.5%
  max_position_value: 150000
  max_trades_per_day: 3
  daily_max_loss: 0.015    # 單日累計虧損達 1.5% 就停止開新倉
  lot_size: 1000           # 零股能否當沖、能否先賣後買，請以券商規定為準
  tax: 0.0015              # 現股當沖證交稅減半
  allow_short: false       # 先賣後買（需資格，且受平盤下限制）
  strategy: orb            # orb 開盤區間突破 | vwap 回測均價站回
  quote_source: twse_mis   # twse_mis（免費、非官方，可能擋海外 IP）
                           # fugle（富果 REST 輪詢）| fugle_ws（富果 WebSocket 即時推送，雲端主機建議用這個）
  watch_enabled: false     # 雲端主機部署時，是否每個交易日 08:55 自動啟動盤中監控
  save_bars: true          # auto 收盤流程中用富果存觀察名單的 1 分 K（需 FUGLE_API_KEY）
  orb_minutes: 15
  vwap_start: "09:30"
  max_risk_atr: 0.6        # 停損距離最多 0.6 ATR
  rr_target: 2.0           # 停利 = 2 倍風險
  entry_cutoff: "11:30"    # 之後不開新倉
  flat_time: "13:20"       # 強制平倉時間
  watchlist_size: 6
  min_avg_value: 200000000 # 20 日均成交值 ≥ 2 億
  atr_pct_min: 0.02
  atr_pct_max: 0.08
  min_volume_ratio: 1.2
